<header class="toolbar no-print" role="navigation" aria-label="Barra de ferramentas">

  <mat-toolbar>
    <button matIconButton matTooltip="Menu de ferramentas"  [matMenuTriggerFor]="menu" aria-label="Menu de ferramentas">
      <mat-icon>menu</mat-icon>
    </button>
    <mat-menu #menu="matMenu">
      <button mat-menu-item disabled matTooltip="imprimir o relatório" aria-label="imprimir o relatório">
        <mat-icon>print</mat-icon>
        <span>imprimir o relatório</span>
      </button>
    </mat-menu>

    <span class="spacer"></span>

    <button matIconButton matTooltip="imprimir o relatório" aria-label="imprimir o relatório" onclick="window.print()">
      <mat-icon>print</mat-icon>
    </button>
  </mat-toolbar>

</header>

<router-outlet />

<main>

  <!-- Capa (página 1) -->
  <section class="page" id="capa">
    <div class="cover-inner">

      <div class="cover-content">
        <h1 class="title" contenteditable="true">Associação</h1>
        <h2 class="subtitle" contenteditable="true">Relatório anual e atualizações</h2>
        <p class="meta" contenteditable="true">Data: <span id="reportDate">00/00/0000</span></p>
      </div>

      <div class="cover-footer" contenteditable="true">
        Associação - CEP 00.000-000 - Campinas/SP
      </div>
      
    </div>
  </section>

  <!-- Conteúdo principal (páginas 2 em diante) -->


  <!-- Contracapa final (página última) -->
  <section class="page" id="contracapa">
    <div class="back-inner" contenteditable="true">
      <h3>Obrigado</h3>
      <p>Associação — Todos os direitos reservados</p>
    </div>
  </section>

</main>

<footer class="no-print">
  <p>Relatório gerado pela Administração da Associação &copy; 2025</p>
</footer>
